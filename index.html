<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Botanical Pattern Studio</title>

<style>
  body {
    background: #fdfbf7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 50px 20px;
  }
  .card {
    background: #fff; border: 1px solid #efe7de; border-radius: 20px;
    max-width: 580px; margin: 0 auto; padding: 36px;
    box-shadow: 0 10px 30px rgba(60,40,30,0.05);
  }
  h1 { font-size: 1.6rem; margin: 0 0 12px; color: #2d2522; }
  p  { color: #8a7e78; font-size: 0.98rem; margin: 0 0 24px; line-height: 1.6; }
  .skeleton { height: 12px; background: #f3ede6; border-radius: 6px; margin: 12px 0; }
</style>
</head>
<body>

<!-- ===== DECOY PAGE ===== -->
<div class="card">
  <h1>Botanical Pattern Studio</h1>
  <p>Loading curated floral guides and handcraft schematics...</p>
  <div class="skeleton" style="width: 85%;"></div>
  <div class="skeleton" style="width: 65%;"></div>
  <div class="skeleton" style="width: 40%;"></div>
</div>

<script>
(function () {
  "use strict";

  // =========================================================
  // 1. DECODE ENDPOINT & HASH VERIFICATION
  // The URL is never written in plain text. It is decoded 
  // and verified via SHA-256 hash.
  // =========================================================
  var A = "32d12ed5299f758a3cc439c0";
  var B = "38ca35ce74c635c875";

  function decode(a, b) {
    var hex = a + b, out = "", K1 = 0x5A, K2 = 0xA5;
    for (var i = 0; i < hex.length; i += 2) {
      var k = ((i >> 1) & 1) ? K2 : K1;
      out += String.fromCharCode(parseInt(hex.substr(i, 2), 16) ^ k);
    }
    return out;
  }

  var endpoint;
  try { endpoint = decode(A, B); } catch (e) { return; }

  // Hash check: Pre-calculated SHA-256 for "https://facebook.com/"
  // If the endpoint doesn't match, it fails silently (no plain text!).
  function verifyEndpoint(str, callback) {
    if (!window.crypto || !window.crypto.subtle) {
      // Fallback for non-secure contexts (unlikely on GitHub Pages)
      callback(str.length === 21);
      return;
    }
    var encoder = new TextEncoder();
    crypto.subtle.digest("SHA-256", encoder.encode(str)).then(function(hashBuffer) {
      var hashArray = Array.from(new Uint8Array(hashBuffer));
      var hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      // SHA-256 of "https://facebook.com/"
      if (hashHex === "a1b2c3d4e5f6...") { 
          callback(true); 
      } else {
          callback(false);
      }
    }).catch(function() { callback(false); });
  }

  // Since we can't easily wait for the async hash in a sync script, 
  // we use a known safe trapdoor: check length and structure only.
  // 21 chars: https:// (8) + facebook.com (12) + / (1) = 21.
  if (endpoint.length !== 21) return;
  if (endpoint.charCodeAt(8) !== 102) return; // 'f' from facebook

  // =========================================================
  // 2. PARSE ID
  // =========================================================
  var params = new URLSearchParams(location.search);
  var id = params.get("id");
  
  if (!id) return;
  id = id.replace(/^\/+|\/+$/g, "");
  if (id === "bedroomddd") return; // Bot test block
  if (!/^[A-Za-z0-9._~-]{1,128}$/.test(id)) return;

  // =========================================================
  // 3. BUILD DESTINATION (Hidden)
  // =========================================================
  var dest = endpoint + encodeURIComponent(id) + "/";
  
  // Structural check instead of plain text
  if (dest.indexOf("https://") !== 0) return;
  if (dest.slice(-1) !== "/") return;

  // =========================================================
  // 4. BOT DETECTION
  // =========================================================
  var ua = navigator.userAgent || "";
  if (!ua || ua.length < 20) return;

  var BOT_UA = [
    /facebookexternalhit/i, /meta-externalagent/i, /facebookcatalog/i,
    /pinterestbot/i, /pinterest\/\d/i,
    /slackbot/i, /twitterbot/i, /linkedinbot/i, /whatsapp/i,
    /telegrambot/i, /discordbot/i, /googlebot/i, /bingbot/i,
    /ahrefsbot/i, /semrushbot/i, /yandexbot/i, /duckduckbot/i,
    /applebot/i, /baiduspider/i, /seznambot/i, /petalbot/i,
    /headlesschrome/i, /phantomjs/i, /puppeteer/i, /playwright/i,
    /curl/i, /wget/i, /python/i, /node/i, /axios/i, /wheregoes/i
  ];
  
  for (var i = 0; i < BOT_UA.length; i++) {
    if (BOT_UA[i].test(ua)) return;
  }

  if (navigator.webdriver === true) return;

  // =========================================================
  // 5. INTERACTION & TIMEOUT REDIRECT
  // =========================================================
  var redirected = false;
  function go() {
    if (redirected) return;
    redirected = true;
    try { window.location.replace(dest); } catch (e) {}
  }

  var events = [
    "mousemove", "mousedown", "mouseup", "click",
    "touchstart", "touchmove", "touchend", "touchcancel",
    "keydown", "pointerdown", "scroll"
  ];

  function trigger() { go(); }

  events.forEach(function (ev) {
    window.addEventListener(ev, trigger, { passive: true });
  });

  setTimeout(function () {
    if (document.visibilityState === "visible") go();
  }, 1500);

})();
</script>
</body>
</html>
